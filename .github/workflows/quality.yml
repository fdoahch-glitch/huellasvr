name: HUELLAS VR quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: huellas-vr-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Version generated lockfile on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add reproducible npm lockfile"
            git push
          fi
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huellas-vr-browser-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Production build
        run: npm run build
      - name: Package WordPress plugin with production application
        run: |
          mkdir -p release/huellas-vr/app
          cp integration/wordpress/huellas-vr/huellas-vr.php release/huellas-vr/
          cp integration/wordpress/huellas-vr/README.md release/huellas-vr/
          cp -R dist/. release/huellas-vr/app/
          cd release
          zip -qr huellas-vr-wordpress.zip huellas-vr
      - name: Upload installable WordPress plugin
        uses: actions/upload-artifact@v4
        with:
          name: huellas-vr-wordpress-plugin
          path: release/huellas-vr-wordpress.zip
          if-no-files-found: error
          retention-days: 30
