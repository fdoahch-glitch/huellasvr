name: Huellas VR · auditoría de paridad v19
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  parity-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar paridad, modelos, animaciones y recursos
        run: node tests/audit-v19-parity.mjs
      - name: Instalar Playwright y Chromium
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Probar los cinco mundos en Chromium con WebGL2
        run: node tests/browser-smoke.mjs
      - name: Guardar capturas de los mundos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huellasvr-browser-world-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
