name: Huellas VR · auditoría de paridad v19
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  parity-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar paridad, modelos, animaciones y recursos
        run: node tests/audit-v19-parity.mjs
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probar los cinco mundos en Chromium con WebGL2
        run: node tests/browser-smoke.mjs
