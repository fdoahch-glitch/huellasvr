name: Huellas VR · auditoría de paridad v19
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/**'
      - 'tests/**'
      - '*.md'
      - '*.txt'
      - 'package.json'
      - 'package-lock.json'
      - '*.md'
      - '*.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'models/**'
      - 'img/**'
      - '.github/workflows/v19-parity-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/**'
      - 'tests/**'
      - '*.md'
      - '*.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'models/**'
      - 'img/**'
      - '.github/workflows/v19-parity-audit.yml'
concurrency:
  group: huellasvr-parity-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  parity-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Registrar revisión exacta del motor original
        run: |
          echo "Commit bajo prueba: $(git rev-parse HEAD)"
          echo "Prueba de panorama y alfa de nubes restaurados desde el original."
          echo "Auditoría de orillas de ríos y escala atmosférica original."
          echo "Verificación de paneles planos y brillo de agua corregidos."
          echo "Verificación del cauce sin cinta especular duplicada."
          echo "Se validan panorama, ríos, vegetación, cinco mundos y rendimiento por separado."
          git status --short
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar paridad, modelos, animaciones y recursos
        run: node tests/audit-v19-parity.mjs
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - name: Empaquetar Babylon.js, cargadores y Havok localmente
        run: npm run vendor:babylon
      - name: Incorporar dependencias locales generadas al repositorio
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/babylon
          if ! git diff --cached --quiet; then
            git commit -m "chore(vendor): incluir Babylon.js y Havok locales [skip ci]"
            git push
          fi
      - name: Probar los cinco mundos en Chromium con WebGL2
        run: node tests/browser-smoke.mjs
      - name: Validar efectos visuales del perfil equilibrado en los cinco mundos
        run: HUELLAS_VISUAL_TEST=1 node tests/browser-smoke.mjs
      - name: Comprobar memoria, navegación repetida y compatibilidad WebXR
        run: node tests/stability-smoke.mjs
      - name: Medir rendimiento del perfil equilibrado solo con GPU física verificable
        run: node tests/performance-smoke.mjs
      - name: Guardar capturas de los mundos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huellasvr-browser-world-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
