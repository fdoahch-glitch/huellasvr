name: Huellas VR validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huellas-vr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, unit, browser and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser E2E tests (WebGL2)
        run: npm run test:e2e
      - name: Production build
        run: npm run build
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huellas-vr-stage7-validation
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
